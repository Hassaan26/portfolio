name: Generate Biweekly Portfolio Articles
on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    inputs:
      post_only:
        description: 'Skip article generation and only share the latest article on LinkedIn'
        type: boolean
        default: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate New Article
        if: ${{ !inputs.post_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-articles.js

      - name: Commit and Push Changes
        if: ${{ !inputs.post_only }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/articles.json
          git diff --staged --quiet || (git commit -m 'chore: auto-generate biweekly article' && git pull --rebase origin main && git push)

      - name: Share on LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
        run: node scripts/post-to-linkedin.js
